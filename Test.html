<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC PREDICT - MATCH WINNER HISTORICAL PREDICTIONS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;700&display=swap');
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Proxima Nova', Arial, sans-serif;
      background-color: #2c2c2e;
      color: #d3d3d3;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      text-align: center;
      flex-wrap: wrap;
    }
    .header img { width: 80px; margin-right: 10px; }
    .header h1 { font-size: 32px; margin: 0; text-transform: uppercase; }

    nav { margin-bottom: 10px; text-align: center; }
    nav a {
      color: #d3d3d3; text-decoration: none; margin: 0 10px; font-size: 16px;
      padding: 5px 10px; background-color: #3c3c3e; border-radius: 5px;
    }
    nav a.active { background-color: #f09300; color: white; }
    nav a:hover { background-color: #f09300; color: white; }

    .filter-title {
      margin: 15px 0 5px; font-size: 18px; text-align: center; font-weight: bold; color: #f0f0f0;
    }
    .filters { display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
    .filters label { margin: 0 10px; cursor: pointer; }

    .mobile-info { margin-bottom: 20px; font-size: 16px; text-align: center; color: #f0f0f0; }
    .loading-message { font-size: 16px; color: #f0f0f0; text-align: center; margin-bottom: 10px; }

    /* Table container (75% on desktop) */
    .table-container {
      width: 75%;
      margin: 0 auto;
      overflow-x: auto;
      padding-left: 10px;
      padding-right: 10px;
      box-sizing: border-box;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      background-color: #3c3c3e;
      font-size: 16px;
      table-layout: auto;
    }
    th, td { padding: 8px; text-align: center; border: none; }
    th { background-color: #f09300; color: white; }
    tr:nth-child(even) { background-color: #2c2c2e; }
    td img { width: 18px; height: 18px; }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .header img { width: 60px; }
      .header h1 { font-size: 22px; }
      nav a { display: block; margin: 5px 0; font-size: 14px; }
      body, html { margin: 0; padding: 0; overflow-x: hidden; }
      .table-container { width: 100%; }
      table { font-size: 10px; }
      th, td { padding: 2px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="images/mcpredcirclebg.png" alt="MC Predict Logo">
    <h1>MC PREDICT</h1>
  </div>

  <nav>
    <a href="/index">HOME</a>
    <a href="/hda-value">MATCH RESULT</a>
    <a href="/uo-value">UNDER/OVER 2.5</a>
    <a href="/match-winner-historical" class="active">HISTORICAL PREDICTIONS</a>
  </nav>

  <div class="filter-title">Odds Format</div>
  <div class="filters">
    <label><input type="radio" name="oddsFormat" value="fractional" checked> Fractional</label>
    <label><input type="radio" name="oddsFormat" value="decimal"> Decimal</label>
  </div>

  <div class="mobile-info">On mobile, the table resizes automatically to fit your screen</div>
  <div class="loading-message" id="loadingMessage">Loading historical predictions...</div>

  <div class="table-container" id="sheet-data"></div>

  <script>
    let allRows = [];
    let headerRow = [];
    let dataRows = [];
    let oddsFormat = "fractional";

    function csvToRows(text) {
      return text.trim().split("\n").map(r => r.split(","));
    }

    async function loadCSV() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=0&single=true&output=csv";
      const response = await fetch(url);
      const text = await response.text();
      allRows = csvToRows(text);

      // Row 1 = headers
      headerRow = allRows[0] || [];
      dataRows = allRows.slice(1);

      renderTable();
      document.getElementById("loadingMessage").style.display = "none";
    }

    function renderTable() {
      const container = document.getElementById("sheet-data");
      const maxRows = 500;

      // Column indexes (A=0)
      const colIndexes = oddsFormat === "fractional"
        ? [7, 11, 12, 13, 14, 18, 21, 23, 26, 28, 29] // H,L,M,N,O,S,V,X,AA,AC,AD
        : [7, 11, 12, 13, 14, 15, 20, 23, 26, 28, 29]; // H,L,M,N,O,P,U,X,AA,AC,AD

      const colHeaders = colIndexes.map(i => headerRow[i] || "");

      let html = "<table><tr>";
      colHeaders.forEach(h => { html += `<th>${h}</th>`; });
      html += "</tr>";

      dataRows.slice(0, maxRows).forEach(row => {
        html += "<tr>";
        colIndexes.forEach((i, idx) => {
          let cell = row[i] || "";
          if (idx === colIndexes.length - 1) { // AD column tick/cross
            if (cell.trim() === "1") {
              cell = '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Yes_Check_Circle.svg/20px-Yes_Check_Circle.svg.png" alt="✔">';
            } else if (cell.trim() === "0") {
              cell = '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Error.svg/20px-Error.svg.png" alt="✘">';
            }
          }
          html += `<td>${cell}</td>`;
        });
        html += "</tr>";
      });

      html += "</table>";
      container.innerHTML = html;
    }

    document.querySelectorAll("input[name='oddsFormat']").forEach(input => {
      input.addEventListener("change", (e) => {
        oddsFormat = e.target.value;
        renderTable();
      });
    });

    loadCSV();
  </script>
</body>
</html>
