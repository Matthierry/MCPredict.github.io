<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>MC PREDICT - MATCH WINNER HISTORICAL PREDICTIONS</title>

  <!-- Fonts & Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- PapaParse (CSV) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"
    integrity="sha512-dl9yqU2oH5QY2oKVOm7cZ8ywFq6mK6lBk8z3xJwPJu8z8m4pPZcYjX6tqz9qP0Lw2bQ1q2i3u9W2g1H1y0g7Ww=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- DataTables -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css"
  />
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <!-- Select2 (for searchable dropdown filters) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <style>
    /* ======= Site Look & Feel (match MC Predict dark theme) ======= */
    @import url('https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;700&display=swap');

    :root {
      --bg: #2c2c2e;
      --panel: #3c3c3e;
      --accent: #f09300;
      --text: #d3d3d3;
      --muted: #bdbdbd;
    }

    html, body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Proxima Nova', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      text-align: center;
    }
    .header img { width: 80px; }
    .header h1 { margin: 0; text-transform: uppercase; font-size: 32px; }

    nav { margin-bottom: 10px; text-align: center; }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin: 0 8px;
      font-size: 15px;
      padding: 6px 10px;
      background-color: var(--panel);
      border-radius: 5px;
      display: inline-block;
    }
    nav a.active, nav a:hover { background-color: var(--accent); color: #fff; }

    .controls {
      width: 75%;
      max-width: 1300px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      justify-content: space-between;
      margin: 8px auto 10px;
    }

    .date-range { display: flex; gap: 8px; align-items: center; }
    .date-range label { color: var(--muted); font-size: 14px; }
    .date-range input[type="date"] {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: var(--panel);
      color: var(--text);
    }

    .table-container {
      width: 75%;
      max-width: 1300px;
      margin: 0 auto;
      background: var(--panel);
      border-radius: 10px;
      padding: 8px 8px 2px;
      box-sizing: border-box;
    }

    table.dataTable {
      width: 100% !important;
      border-collapse: collapse;
      background: var(--panel);
      table-layout: auto; /* let columns shrink to fit */
      font-size: 15px;
    }

    thead th {
      background: var(--accent) !important;
      color: #fff !important;
      font-weight: 700;
      text-align: center;
      position: sticky; /* sticky header */
      top: 0;
      z-index: 2;
      padding: 10px 8px !important;
      white-space: normal; /* allow wrapping at spaces */
    }

    tbody td {
      text-align: center;
      vertical-align: middle;
      padding: 10px 8px;
      border: none;
      color: var(--text);
      white-space: normal;     /* wrap only at spaces */
      word-break: normal;      /* never break inside words */
      overflow-wrap: normal;   /* never break inside words */
    }

    tbody tr:nth-child(even){ background: #2c2c2e; }
    tbody tr:hover { background: #2f2f31; }

    /* Column filter row (Select2 dropdowns) */
    .filters-row th {
      background: #3c3c3e !important;
      padding: 6px !important;
    }
    .filters-row .col-filter {
      width: 100%;
    }
    .select2-container--default .select2-selection--single {
      background-color: #2f2f31;
      border: 1px solid #4b4b4b;
      color: var(--text);
      height: 36px;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
      color: var(--text);
      line-height: 34px;
      padding-left: 8px;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
      height: 34px;
    }
    .select2-dropdown {
      background: #2f2f31;
      color: var(--text);
      border: 1px solid #4b4b4b;
    }
    .select2-search__field { color: var(--text); }

    /* Per-site DataTables tweaks */
    .dataTables_wrapper .dataTables_length { float: left; margin: 6px 0; }
    .dataTables_wrapper .dataTables_filter { text-align: right; margin: 6px 0; }
    .dataTables_wrapper .dataTables_info { color: var(--muted); margin-top: 6px; }
    .dataTables_wrapper .dataTables_paginate { margin-top: 6px; }

    .fa-circle-check { color: #4CAF50; }
    .fa-circle-xmark { color: #e74c3c; }

    /* Mobile adjustments: shrink font & padding so table fits (no horizontal scroll) */
    @media (max-width: 900px) {
      .controls, .table-container { width: 95%; }
      table.dataTable { font-size: 13px; }
      thead th, tbody td { padding: 8px 6px; }
    }
    @media (max-width: 600px) {
      .header img { width: 60px; }
      .header h1 { font-size: 22px; }
      nav a { display: block; margin: 6px 0; font-size: 14px; }
      .controls, .table-container { width: 100%; }
      table.dataTable { font-size: 11px; }
      thead th, tbody td { padding: 6px 4px; }
    }
  </style>
</head>
<body>
  <!-- Header / Nav (same structure as other pages) -->
  <div class="header">
    <img src="images/mcpredcirclebg.png" alt="MC Predict Logo" />
    <h1>MC PREDICT</h1>
  </div>

  <nav>
    <a href="/index">HOME</a>
    <a href="/hda-value">MATCH RESULT</a>
    <a href="/uo-value">UNDER/OVER 2.5</a>
    <a href="/match-winner-historical" class="active">HISTORICAL PREDICTIONS</a>
  </nav>

  <!-- Controls -->
  <div class="controls">
    <div class="date-range">
      <label for="minDate">From</label>
      <input type="date" id="minDate" />
      <label for="maxDate">To</label>
      <input type="date" id="maxDate" />
    </div>
    <div style="flex:1"></div>
  </div>

  <!-- Table -->
  <div class="table-container">
    <table id="predictionsTable" class="display" style="width:100%">
      <thead>
        <tr class="headers-row">
          <th>Date</th>
          <th>League</th>
          <th>Home</th>
          <th>V</th>
          <th>Away</th>
          <th>Prediction</th>
          <th>Bookmaker Price</th>
          <th>Model Price</th>
          <th>Value</th>
          <th>Result</th>
          <th>P/L</th>
          <th>Correct?</th>
        </tr>
        <!-- Filter dropdowns row -->
        <tr class="filters-row">
          <!-- These cells get <select> filters injected in JS (searchable with Select2) -->
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
          <th class="filter-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // ====== Config ======
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=0&single=true&output=csv";

    // Column order & header keys (case-insensitive matching against CSV header row)
    const COL_KEYS = [
      "Date", "League", "Home", "V", "Away", "Prediction",
      "Bookmaker Price", "Model Price", "Value", "Result", "P/L", "Correct?"
    ];

    // Europe/London "today" and default "last 21 days"
    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function ddmmyyyyToISO(ddmmyyyy) {
      if (!ddmmyyyy) return "";
      const parts = ddmmyyyy.split("/");
      if (parts.length !== 3) return "";
      let [d, m, y] = parts;
      if (y.length === 2) y = "20" + y;
      return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
    }

    function parseCurrencyToNumber(text) {
      if (!text) return 0;
      // Strip anything that's not number, minus or dot
      const num = parseFloat(String(text).replace(/[^0-9.-]+/g, ""));
      return isNaN(num) ? 0 : num;
    }

    // Case-insensitive row accessor
    function getCaseInsensitive(row, keyWanted) {
      const wanted = String(keyWanted).toLowerCase().trim();
      for (const k in row) {
        if (Object.hasOwn(row, k) && String(k).toLowerCase().trim() === wanted) {
          return row[k];
        }
      }
      return "";
    }

    $(async function () {
      // Set default date range: today and 21 days ago in Europe/London
      const now = new Date(); // user's browser tz; acceptable for this purpose
      const twentyOneDaysAgo = new Date(now);
      twentyOneDaysAgo.setDate(now.getDate() - 21);
      $("#minDate").val(toISODate(twentyOneDaysAgo));
      $("#maxDate").val(toISODate(now));

      // Load CSV
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          const raw = results.data || [];

          // Build table body + data-order attributes for sorting
          const tbody = document.getElementById("tableBody");
          tbody.innerHTML = "";

          const rows = raw.map((r) => {
            const row = COL_KEYS.map(k => getCaseInsensitive(r, k) ?? "");

            // Prepare display values & sort helpers:
            // Date (index 0) in DD/MM/YYYY -> add data-order ISO
            const iso = ddmmyyyyToISO(row[0]);

            // P/L as currency (index 10)
            const plNum = parseCurrencyToNumber(row[10]);
            const plDisplay = row[10] ? (String(row[10]).trim().startsWith("£") ? row[10] : `£${parseFloat(row[10]).toFixed(2)}`) : "";

            // Correct? (index 11) -> icons
            const correctRaw = String(row[11]).trim();
            const correctHTML =
              correctRaw === "1" ? '<i class="fa-solid fa-circle-check" title="Correct"></i>'
              : correctRaw === "0" ? '<i class="fa-solid fa-circle-xmark" title="Incorrect"></i>'
              : "";

            // Replace display values
            row[10] = plDisplay;
            row[11] = correctHTML;

            return { display: row, isoDate: iso, plSort: plNum };
          });

          // Inject rows
          for (const r of rows) {
            const tr = document.createElement("tr");
            // Set data-order for Date and P/L columns
            r.display.forEach((cell, idx) => {
              const td = document.createElement("td");
              // Date sort key
              if (idx === 0) {
                if (r.isoDate) td.setAttribute("data-order", r.isoDate);
              }
              // P/L numeric sort key
              if (idx === 10) {
                td.setAttribute("data-order", r.plSort);
              }
              td.innerHTML = cell === null || cell === undefined ? "" : cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          }

          // Init DataTable
          const table = $('#predictionsTable').DataTable({
            pageLength: 100,
            lengthMenu: [10, 25, 50, 100, 250, 500],
            order: [[0, 'desc']],   // sort by Date desc on load
            autoWidth: false,
            deferRender: true,
            dom: 'lfrtip',          // length, filter, table, pagination
          });

          // Date range filter (applies to first column which is Date)
          $.fn.dataTable.ext.search.push(function (settings, data) {
            // data[0] is Date as DD/MM/YYYY from the table cell
            const minStr = $('#minDate').val();
            const maxStr = $('#maxDate').val();
            if (!minStr && !maxStr) return true;

            // Convert both bounds to Date
            const min = minStr ? new Date(minStr) : null;
            const max = maxStr ? new Date(maxStr) : null;

            // Convert row date to ISO then to Date
            const iso = ddmmyyyyToISO(data[0]);
            if (!iso) return true;
            const rowDate = new Date(iso);

            if (min && rowDate < min) return false;
            if (max) {
              // inclusive of max day
              const maxInclusive = new Date(max);
              maxInclusive.setHours(23, 59, 59, 999);
              if (rowDate > maxInclusive) return false;
            }
            return true;
          });

          // Apply default last-21-days filter immediately
          table.draw();

          // Re-draw when date inputs change
          $('#minDate, #maxDate').on('change', function () {
            table.draw();
          });

          // Build searchable dropdown filters (Select2) for each column
          $('#predictionsTable thead tr.filters-row th').each(function (i) {
            // Build a select with unique values from column i
            const select = $('<select class="col-filter" data-col="' + i + '"><option value="">All</option></select>');
            $(this).empty().append(select);

            // Gather unique values from the column (post-parse display)
            const colData = table
              .column(i, { search: 'applied' })
              .data()
              .toArray()
              .map(v => $('<div>').html(v).text().trim()); // strip HTML for icons

            const uniques = Array.from(new Set(colData.filter(v => v !== ""))).sort((a, b) => {
              // numeric-aware sort for Value and P/L, otherwise alpha
              if (i === 8 || i === 10) {
                const na = parseCurrencyToNumber(a);
                const nb = parseCurrencyToNumber(b);
                return na - nb;
              }
              return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            });

            uniques.forEach(v => select.append('<option value="' + v.replace(/"/g, '&quot;') + '">' + v + '</option>'));

            // Activate Select2 (searchable)
            select.select2({
              placeholder: 'All',
              allowClear: true,
              width: '100%'
            });

            // When selection changes, filter that column (exact match)
            select.on('change', function () {
              const val = $(this).val();
              if (val) {
                // Regex exact match
                table.column(i).search('^' + $.fn.dataTable.util.escapeRegex(val) + '$', true, false).draw();
              } else {
                table.column(i).search('', true, false).draw();
              }
            });
          });
        }
      });
    });
  </script>
</body>
</html>
