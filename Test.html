<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC PREDICT - MATCH WINNER HISTORICAL PREDICTIONS</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    body {
      background-color: #2c2c2e;
      color: #d3d3d3;
      font-family: 'Proxima Nova', Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 { text-align: center; color: #fff; margin-bottom: 20px; }

    .table-container {
      width: 90%;
      max-width: 1300px;
      margin: auto;
      background: #222224;
      border-radius: 8px;
      padding: 10px;
    }

    table.dataTable {
      width: 100% !important;
      border-collapse: collapse;
      font-size: 15px;
      background: #3c3c3e;
    }

    thead th {
      background: #f09300;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    th, td {
      padding: 8px;
      text-align: center;
      white-space: normal;  /* allow wrapping only at spaces */
      word-break: normal;
    }

    tr:nth-child(even) { background: #2c2c2e; }
    tr:hover { background: #2f2f31; }

    .fa-circle-check { color: #4CAF50; }
    .fa-circle-xmark { color: #e74c3c; }

    /* Mobile */
    @media (max-width: 768px) {
      table.dataTable { font-size: 12px; }
      th, td { padding: 6px; }
    }
  </style>
</head>
<body>
  <h1>Match Winner Historical Predictions</h1>

  <div class="table-container">
    <table id="predictionsTable" class="display">
      <thead>
        <tr>
          <th>Date</th>
          <th>League</th>
          <th>Home</th>
          <th>V</th>
          <th>Away</th>
          <th>Prediction</th>
          <th>Bookmaker Price</th>
          <th>Model Price</th>
          <th>Value</th>
          <th>Result</th>
          <th>P/L</th>
          <th>Correct?</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=0&single=true&output=csv";

    // Convert DD/MM/YYYY → ISO YYYY-MM-DD
    function ddmmyyyyToISO(dateStr) {
      if (!dateStr) return "";
      const [d, m, y] = dateStr.split("/");
      return `${y.length === 2 ? "20" + y : y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
    }

    // Currency to number
    function parseCurrency(text) {
      if (!text) return 0;
      return parseFloat(String(text).replace(/[^0-9.-]+/g, "")) || 0;
    }

    $(document).ready(function () {
      Papa.parse(CSV_URL, {
        download: true,
        complete: function (results) {
          const rows = results.data;

          // drop header row
          const data = rows.slice(1).map(r => {
            const dateISO = ddmmyyyyToISO(r[7]); // Date col H
            const pl = r[28] ? (r[28].startsWith("£") ? r[28] : "£" + parseFloat(r[28]).toFixed(2)) : "";
            const correct = r[29] === "1"
              ? '<i class="fa-solid fa-circle-check"></i>'
              : r[29] === "0"
                ? '<i class="fa-solid fa-circle-xmark"></i>'
                : "";

            return [
              r[7],    // Date
              r[11],   // League
              r[12],   // Home
              r[13],   // V
              r[14],   // Away
              r[15],   // Prediction
              r[18],   // Bookmaker Price
              r[21],   // Model Price
              r[23],   // Value
              r[26],   // Result
              pl,      // P/L
              correct  // Correct?
            ];
          });

          $('#predictionsTable').DataTable({
            data: data,
            pageLength: 100,
            lengthMenu: [10, 25, 50, 100, 250, 500],
            order: [[0, "desc"]],
            columnDefs: [
              { targets: 0, render: (d) => d }, // Date as-is
              { targets: 10, render: (d) => d, type: "num" } // P/L numeric sort
            ]
          });
        }
      });
    });
  </script>
</body>
</html>
