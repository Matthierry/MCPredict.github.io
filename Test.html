<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Winner Historical Predictions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <style>
    /* Responsive adjustments */
    #predictionsTable {
      width: 100% !important;
      table-layout: auto;
      border-collapse: collapse;
      word-wrap: break-word;
      white-space: normal; /* allow wrap at spaces only */
      font-size: 14px; /* base font */
    }

    #predictionsTable th,
    #predictionsTable td {
      padding: 6px 4px;
      text-align: center;
      vertical-align: middle;
    }

    @media (max-width: 768px) {
      #predictionsTable {
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      #predictionsTable {
        font-size: 11px;
      }
      #predictionsTable th,
      #predictionsTable td {
        padding: 4px 2px;
      }
    }

    .filter-container {
      margin-bottom: 15px;
    }
    .filter-container label {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>Match Winner Historical Predictions</h1>

  <div class="filter-container">
    <label for="minDate">From: <input type="date" id="minDate"></label>
    <label for="maxDate">To: <input type="date" id="maxDate"></label>
  </div>

  <div style="overflow-x: hidden; width: 100%;">
    <table id="predictionsTable" class="display nowrap"></table>
  </div>

  <script>
    $(document).ready(function () {
      const sheetUrl =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=0&single=true&output=csv";

      // Custom date range filter
      $.fn.dataTable.ext.search.push(function (settings, data) {
        const min = $('#minDate').val() ? new Date($('#minDate').val()) : null;
        const max = $('#maxDate').val() ? new Date($('#maxDate').val()) : null;
        const date = new Date(data[0]); // Column H is index 0 in our mapped data

        if ((min === null || date >= min) &&
            (max === null || date <= max)) {
          return true;
        }
        return false;
      });

      fetch(sheetUrl)
        .then(response => response.text())
        .then(csvText => {
          const rows = $.csv.toArrays(csvText);

          // Extract headers from row 0
          const headers = [
            rows[0][7],   // H
            rows[0][11],  // L
            rows[0][12],  // M
            rows[0][13],  // N
            rows[0][14],  // O
            rows[0][15],  // P
            rows[0][18],  // S
            rows[0][21],  // V
            rows[0][23],  // X
            rows[0][26],  // AA
            rows[0][28],  // AC
            rows[0][29]   // AD
          ];

          // Data rows
          const dataRows = rows.slice(1).map(r => [
            r[7],   // H Date
            r[11],  // L
            r[12],  // M
            r[13],  // N
            r[14],  // O
            r[15],  // P
            r[18],  // S (fractional odds)
            r[21],  // V (fractional odds)
            r[23],  // X
            r[26],  // AA
            r[28],  // AC currency
            r[29] === "1"
              ? '<img src="/images/green-tick.png" alt="✓" width="16">'
              : r[29] === "0"
                ? '<img src="/images/red-cross.png" alt="✗" width="16">'
                : ""
          ]);

          // Initialize DataTable
          const table = $('#predictionsTable').DataTable({
            data: dataRows,
            columns: headers.map(h => ({ title: h })),
            pageLength: 100,
            lengthMenu: [10, 25, 50, 100, 250, 500],
            order: [[0, 'desc']], // sort by date desc
            responsive: false,
            scrollY: "70vh",
            scrollCollapse: true,
            paging: true,
          });

          // Date filter redraw
          $('#minDate, #maxDate').on('change', function () {
            table.draw();
          });
        });
    });
  </script>

  <!-- CSV parser plugin for jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.21/jquery.csv.min.js"></script>
</body>
</html>
