<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Predict - Fixtures</title>
  <link rel="stylesheet" href="style.css">

  <!-- FontAwesome for tick/cross icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body {
      background-color: #2c2c2e;
      color: #bdbdbd;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    .table-container {
      width: 100%;
      overflow-x: auto; /* fallback scroll if needed */
      background-color: #222224;
      border-radius: 10px;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto; /* fit columns dynamically */
    }

    thead {
      background-color: #1a1a1c;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    th, td {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #333;
      word-wrap: break-word;
      white-space: normal; /* allow wrapping */
    }

    th {
      color: #fff;
      font-weight: bold;
    }

    tr:hover {
      background-color: #2f2f31;
    }

    .currency {
      font-weight: bold;
      color: #4CAF50;
    }

    .icon-yes {
      color: #4CAF50;
    }

    .icon-no {
      color: #e74c3c;
    }

    /* Filters */
    .filters {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filters input, 
    .filters select {
      padding: 6px 10px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #2c2c2e;
      color: #bdbdbd;
    }

    .filters label {
      margin-right: 5px;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      table {
        font-size: 12px;
      }
      th, td {
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <h1>MC Predict - Fixtures</h1>

  <!-- Filters -->
  <div class="filters">
    <div>
      <label for="fromDate">From:</label>
      <input type="date" id="fromDate">
    </div>
    <div>
      <label for="toDate">To:</label>
      <input type="date" id="toDate">
    </div>
    <div>
      <label for="entries">Show:</label>
      <select id="entries">
        <option value="100" selected>100</option>
        <option value="250">250</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="table-container">
    <table id="fixturesTable">
      <thead>
        <tr>
          <th>Date (H)</th>
          <th>Column L</th>
          <th>Column M</th>
          <th>Column N</th>
          <th>Column O</th>
          <th>Column P</th>
          <th>Odds (S)</th>
          <th>Odds (V)</th>
          <th>Column X</th>
          <th>Column AA</th>
          <th>Column AC</th>
          <th>Result (AD)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=0&single=true&output=csv";

    Papa.parse(sheetUrl, {
      download: true,
      header: true,
      complete: function(results) {
        const data = results.data;
        const tbody = document.querySelector("#fixturesTable tbody");
        tbody.innerHTML = "";

        data.forEach(row => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${row["H"] || ""}</td>
            <td>${row["L"] || ""}</td>
            <td>${row["M"] || ""}</td>
            <td>${row["N"] || ""}</td>
            <td>${row["O"] || ""}</td>
            <td>${row["P"] || ""}</td>
            <td>${row["S"] || ""}</td>
            <td>${row["V"] || ""}</td>
            <td>${row["X"] || ""}</td>
            <td>${row["AA"] || ""}</td>
            <td class="currency">${row["AC"] ? "£" + parseFloat(row["AC"]).toFixed(2) : ""}</td>
            <td>
              ${row["AD"] == "1" 
                ? '<i class="fa-solid fa-circle-check icon-yes"></i>' 
                : row["AD"] == "0"
                  ? '<i class="fa-solid fa-circle-xmark icon-no"></i>' 
                  : ""}
            </td>
          `;

          tbody.appendChild(tr);
        });
      }
    });
  </script>
</body>
</html>
