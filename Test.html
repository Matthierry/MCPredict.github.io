<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Predict - Match Winner Historical Predictions</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- FontAwesome for tick/cross icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #2c2c2e;
      color: #bdbdbd;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    .filters {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filters input {
      padding: 6px 10px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #2c2c2e;
      color: #bdbdbd;
    }

    .table-container {
      width: 100%;
      background-color: #222224;
      border-radius: 10px;
      padding: 10px;
    }

    table.dataTable {
      width: 100% !important;
      border-collapse: collapse;
      background-color: #2c2c2e;
    }

    thead {
      background-color: #1a1a1c;
    }

    th, td {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #333;
      white-space: normal; /* allow wrapping at spaces */
    }

    th {
      color: #fff;
      font-weight: bold;
    }

    tr:hover {
      background-color: #2f2f31;
    }

    .currency {
      font-weight: bold;
      color: #4CAF50;
    }

    .icon-yes {
      color: #4CAF50;
    }

    .icon-no {
      color: #e74c3c;
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      table {
        font-size: 12px;
      }
      th, td {
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <h1>Match Winner Historical Predictions</h1>

  <!-- Date filters -->
  <div class="filters">
    <div>
      <label for="minDate">From:</label>
      <input type="date" id="minDate">
    </div>
    <div>
      <label for="maxDate">To:</label>
      <input type="date" id="maxDate">
    </div>
  </div>

  <div class="table-container">
    <table id="predictionsTable" class="display">
      <thead>
        <tr>
          <th>Date</th>
          <th>League</th>
          <th>Home</th>
          <th>V</th>
          <th>Away</th>
          <th>Prediction</th>
          <th>Bookmaker Price</th>
          <th>Model Price</th>
          <th>Value</th>
          <th>Result</th>
          <th>P/L</th>
          <th>Correct?</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=0&single=true&output=csv";

    $(document).ready(function () {
      // Date filter
      $.fn.dataTable.ext.search.push(function (settings, data) {
        const min = $('#minDate').val() ? new Date($('#minDate').val()) : null;
        const max = $('#maxDate').val() ? new Date($('#maxDate').val()) : null;
        const date = new Date(data[0]); // first column = Date

        if ((!min || date >= min) && (!max || date <= max)) {
          return true;
        }
        return false;
      });

      Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function (results) {
          const data = results.data.map(row => [
            row["Date"] || "",
            row["League"] || "",
            row["Home"] || "",
            row["V"] || "",
            row["Away"] || "",
            row["Prediction"] || "",
            row["Bookmaker Price"] || "",
            row["Model Price"] || "",
            row["Value"] || "",
            row["Result"] || "",
            row["P/L"] ? "£" + parseFloat(row["P/L"]).toFixed(2) : "",
            row["Correct?"] == "1"
              ? '<i class="fa-solid fa-circle-check icon-yes"></i>'
              : row["Correct?"] == "0"
                ? '<i class="fa-solid fa-circle-xmark icon-no"></i>'
                : ""
          ]);

          const table = $('#predictionsTable').DataTable({
            data: data,
            pageLength: 100,
            lengthMenu: [10, 25, 50, 100, 250, 500],
            order: [[0, "desc"]], // sort by Date
          });

          $('#minDate, #maxDate').on('change', function () {
            table.draw();
          });
        }
      });
    });
  </script>
</body>
</html>
