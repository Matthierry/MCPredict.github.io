<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Predict | Top Value Bets</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css" />

  <style>
    .home-topbar{padding-bottom:8px;margin:14px auto 8px;max-width:1120px;padding-left:14px;padding-right:14px;}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#3a3a3c,#262628);box-shadow:0 12px 25px rgba(0,0,0,.45);}
    .brand-header-link{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit;border-radius:12px;}
    .brand-header-link:focus-visible{outline:2px solid #f7b057;outline-offset:3px;}
    .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .topbar-logo{width:44px;height:44px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#f09300,#1d1d1f);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .topbar-logo img{width:70%;height:70%;object-fit:contain;}
    .topbar-title h1{margin:0;font-size:20px;letter-spacing:.18em;color:#fff;white-space:nowrap;}
    .topbar-title span{font-size:12px;color:#a5a5a7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
    @media (max-width:640px){.home-topbar{padding-left:10px;padding-right:10px;margin-top:10px}.topbar-title h1{font-size:17px;letter-spacing:.14em}}
  </style>
</head>
<body>
  <header class="home-topbar">
    <div class="topbar-inner">
      <a class="brand-header-link" href="/" aria-label="MC Predict home">
        <div class="topbar-left">
          <div class="topbar-logo"><img src="/images/mcpredcirclebg.png" alt=""></div>
          <div class="topbar-title">
            <h1>MC PREDICT</h1>
            <span>Data-driven Football predictions</span>
          </div>
        </div>
      </a>
    </div>
  </header>

  <main class="page">
    <header class="hero">
      <p class="eyebrow">HDA Value 2.0</p>
      <h1>🔥 Top value bets today</h1>
      <p class="subtitle">Ranked by model edge vs market</p>
    </header>

    <section class="filter-bar" aria-label="filters">
      <div class="filter-group">
        <span class="filter-label">Day</span>
        <div id="dayFilters" class="pill-row"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Result</span>
        <div id="resultFilters" class="pill-row"></div>
      </div>
    </section>

    <section id="featuredSection" class="featured-section"></section>

    <section class="tier-section">
      <h2>🔥 Strong Value</h2>
      <div id="tier1List" class="card-list"></div>
    </section>

    <section class="tier-section">
      <h2>⭐ Good Value</h2>
      <div id="tier2List" class="card-list"></div>
    </section>

    <section class="tier-section tier-section--collapsible">
      <button id="tier3Toggle" class="tier-toggle" type="button" aria-expanded="false">
        ▼ More Picks (0)
      </button>
      <div id="tier3List" class="card-list hidden"></div>
    </section>

    <section class="tier-section tier-section--collapsible">
      <button id="overflowToggle" class="tier-toggle" type="button" aria-expanded="false">
        ▼ Remaining Picks (0)
      </button>
      <div id="overflowList" class="card-list hidden"></div>
    </section>

    <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>
  </main>

  <aside id="shortlistBar" class="shortlist-bar hidden" aria-live="polite">
    <div>
      <strong id="shortlistCount">0 picks</strong>
      <p id="shortlistOdds">Est. Odds: 1.00</p>
    </div>
    <button id="viewShortlistBtn" type="button" class="btn-primary">View Shortlist</button>
  </aside>

  <dialog id="shortlistModal" class="shortlist-modal">
    <div class="modal-head">
      <h3>Your Shortlist</h3>
      <button id="closeModalBtn" class="icon-btn" type="button" aria-label="Close">✕</button>
    </div>
    <div id="shortlistItems" class="modal-list"></div>
    <div class="modal-foot">
      <p id="modalOdds">Combined Odds: 1.00</p>
      <div class="modal-actions">
        <button id="copyPicksBtn" type="button" class="btn-secondary">Copy Picks</button>
        <button id="clearPicksBtn" type="button" class="btn-danger">Clear</button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
