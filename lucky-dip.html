<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucky Dip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #2c2c2e;
      color: #bdbdbd;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .question {
      margin: 20px 0;
    }

    .question h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      background-color: #222224;
      color: #bdbdbd;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
      min-width: 100px;
    }

    button:hover:enabled {
      background-color: #444;
    }

    button:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .active {
      background-color: #f09300 !important;
      color: #fff !important;
    }

    .loading {
      font-size: 1rem;
      color: #f09300;
      margin-top: 15px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .fade-out {
      opacity: 0 !important;
    }

    #generateBtn, #regenerateBtn {
      margin: 20px 0;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 10px;
      border: none;
    }

    #generateBtn {
      background-color: #f09300;
      color: white;
    }

    #regenerateBtn {
      background-color: #f09300;
      color: white;
      display: none;
    }

    table {
      border-collapse: collapse;
      margin: 20px auto;
      width: 75%;
      max-width: 100%;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #444;
    }

    tr:nth-child(even) {
      background-color: #222224;
    }

    tr:nth-child(odd) {
      background-color: #2c2c2e;
    }

    @media (max-width: 768px) {
      table {
        width: 100% !important;
      }
      th, td {
        padding: 6px;
        font-size: 0.85rem;
      }
      button {
        min-width: 80px;
        padding: 8px 12px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>Lucky Dip</h1>

  <div id="questionsContainer"></div>
  <div id="loadingMessage" class="loading" style="display:none;">Loading questions...</div>
  <button id="generateBtn" style="display:none;">Generate</button>
  <button id="regenerateBtn">Regenerate</button>

  <div id="resultsContainer"></div>

  <script>
    const sheetCheckUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=772292951&single=true&output=csv";

    const tableUrls = {
      "Match Winner|Value": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=772292951&single=true&output=csv",
      "Match Winner|Chance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=1040433174&single=true&output=csv",
      "Over/Under|Value": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=702828084&single=true&output=csv",
      "Over/Under|Chance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=1035748278&single=true&output=csv"
    };

    const dayOrder = ["Friday","Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday"];
    let selectedAnswers = {};
    let tableData = [];

    async function init() {
      const csv = await fetchCSV(sheetCheckUrl);
      const rows = csv.split("\n").map(r => r.split(","));
      if (!rows[19] || rows[19].every(cell => cell.trim() === "")) {
        document.getElementById("questionsContainer").innerHTML =
          '<p>The model currently has no fixtures to process, please check again later. It is normally ready by 5pm UK time on a Friday but can sometimes be later.</p>';
        return;
      }
      showQuestion1();
    }

    function showLoading(belowId) {
      const loading = document.getElementById("loadingMessage");
      if (belowId) {
        document.getElementById(belowId).insertAdjacentElement("afterend", loading);
      }
      loading.style.display = "block";
      loading.classList.remove("fade-out");
    }

    function hideLoading() {
      const loading = document.getElementById("loadingMessage");
      loading.classList.add("fade-out");
      setTimeout(() => loading.style.display = "none", 500);
    }

    function createQuestion(id, text, options) {
      const container = document.getElementById("questionsContainer");
      const qDiv = document.createElement("div");
      qDiv.className = "question";
      qDiv.id = id;

      const title = document.createElement("h2");
      title.textContent = text;
      qDiv.appendChild(title);

      const group = document.createElement("div");
      group.className = "button-group";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt.label;
        btn.dataset.value = opt.value;
        btn.onclick = () => {
          group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          selectedAnswers[id] = btn.dataset.value;
          if (opt.onSelect) opt.onSelect();
        };
        group.appendChild(btn);
      });

      qDiv.appendChild(group);
      container.appendChild(qDiv);
    }

    function showQuestion1() {
      createQuestion("q1", "Match Winner or Under/Over 2.5 Goals?", [
        {label:"Match Winner", value:"Match Winner", onSelect: showQuestion1a},
        {label:"Under/Over 2.5 Goals", value:"Over/Under", onSelect: showQuestion1b}
      ]);
    }

    function showQuestion1a() {
      showLoading("q1");
      setTimeout(() => {
        hideLoading();
        createQuestion("q1a", "Home wins, Away wins, or Home & Away Wins?", [
          {label:"Home Wins", value:"HOME WIN", onSelect: showQuestion2},
          {label:"Away Wins", value:"AWAY WIN", onSelect: showQuestion2},
          {label:"Home & Away Wins", value:"BOTH", onSelect: showQuestion2}
        ]);
      }, 500);
    }

    function showQuestion1b() {
      showLoading("q1");
      setTimeout(() => {
        hideLoading();
        createQuestion("q1b", "Under 2.5 goals, Over 2.5 goals, or Both?", [
          {label:"Under 2.5 Goals", value:"UNDER 2.5", onSelect: showQuestion2},
          {label:"Over 2.5 Goals", value:"OVER 2.5", onSelect: showQuestion2},
          {label:"Under & Over 2.5 Goals", value:"BOTH", onSelect: showQuestion2}
        ]);
      }, 500);
    }

    function showQuestion2() {
      showLoading("q1a") || showLoading("q1b");
      setTimeout(() => {
        hideLoading();
        createQuestion("q2", "Which do you prefer?", [
          {label:"A good value bet", value:"Value", onSelect: loadTable},
          {label:"A higher chance of winning", value:"Chance", onSelect: loadTable}
        ]);
      }, 500);
    }

    async function loadTable() {
      showLoading("q2");
      const key = selectedAnswers.q1 + "|" + selectedAnswers.q2;
      const url = tableUrls[key];
      tableData = (await fetchCSV(url)).split("\n").map(r => r.split(","));
      hideLoading();
      showQuestion3();
    }

    function showQuestion3() {
      const header = tableData[1]; 
      const dayColIndex = 0; 
      const daysRaw = tableData.slice(2).map(r => r[dayColIndex].trim()).filter(Boolean);
      const uniqueDays = [...new Set(daysRaw)].map(d => convertDay(d));
      const sortedDays = dayOrder.filter(d => uniqueDays.includes(d));
      const options = sortedDays.map(d => ({label:d, value:d, onSelect: showQuestion4}));

      createQuestion("q3", "Which day(s) of the fixtures?", options);
    }

    function convertDay(abbrev) {
      const map = { "Fri":"Friday","Sat":"Saturday","Sun":"Sunday","Mon":"Monday","Tue":"Tuesday","Wed":"Wednesday","Thu":"Thursday" };
      return map[abbrev] || abbrev;
    }

    function showQuestion4() {
      const available = Math.min(8, tableData.length - 2);
      const options = Array.from({length: available}, (_,i) => ({
        label:String(i+1), value:(i+1).toString(), onSelect: maybeShowGenerate
      }));
      createQuestion("q4", "Number of selections?", options);
    }

    function maybeShowGenerate() {
      document.getElementById("generateBtn").style.display = "inline-block";
    }

    document.getElementById("generateBtn").onclick = generateResults;
    document.getElementById("regenerateBtn").onclick = generateResults;

    function generateResults() {
      const resultsContainer = document.getElementById("resultsContainer");
      const generateBtn = document.getElementById("generateBtn");
      const regenerateBtn = document.getElementById("regenerateBtn");

      generateBtn.classList.add("fade-out");
      setTimeout(() => generateBtn.style.display = "none", 500);

      regenerateBtn.style.display = "inline-block";

      let rows = tableData.slice(2, 50); 
      if (selectedAnswers.q3) {
        rows = rows.filter(r => convertDay(r[0].trim()) === selectedAnswers.q3);
      }
      if (selectedAnswers.q1a) {
        rows = rows.filter(r => r[5] === selectedAnswers.q1a || selectedAnswers.q1a === "BOTH");
      }
      if (selectedAnswers.q1b) {
        rows = rows.filter(r => r[5] === selectedAnswers.q1b || selectedAnswers.q1b === "BOTH");
      }

      const numSelections = parseInt(selectedAnswers.q4,10) || 1;
      const weighted = weightedSample(rows, numSelections);

      const table = document.createElement("table");
      const headerRow = document.createElement("tr");
      tableData[1].forEach(h => {
        if (h.trim() !== "Day") {
          const th = document.createElement("th");
          th.textContent = h;
          headerRow.appendChild(th);
        }
      });
      table.appendChild(headerRow);

      weighted.forEach(r => {
        const tr = document.createElement("tr");
        r.forEach((cell,i) => {
          if (i !== 0) { 
            const td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
          }
        });
        table.appendChild(tr);
      });

      resultsContainer.innerHTML = "";
      resultsContainer.appendChild(table);
    }

    function weightedSample(rows, count) {
      const weighted = [];
      for (let i = 0; i < rows.length; i++) {
        const weight = Math.max(1, rows.length - i);
        for (let w = 0; w < weight; w++) {
          weighted.push(rows[i]);
        }
      }
      const result = [];
      while (result.length < count && weighted.length) {
        const idx = Math.floor(Math.random() * weighted.length);
        result.push(weighted[idx]);
        weighted.splice(idx, 1);
      }
      return result;
    }

    async function fetchCSV(url) {
      const res = await fetch(url);
      return await res.text();
    }

    init();
  </script>
</body>
</html>
