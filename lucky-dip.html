<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC PREDICT - Lucky Dip</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;700&display=swap');

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
      font-family: 'Proxima Nova', Arial, sans-serif;
      background-color: #2c2c2e;
      color: #d3d3d3;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .header img { width: 80px; margin-right: 10px; }
    .header h1 { font-size: 36px; margin: 0; text-transform: uppercase; }

    nav, .sub-nav { text-align: center; margin-bottom: 10px; }
    nav a, .sub-nav a {
      color: #d3d3d3;
      text-decoration: none;
      margin: 0 10px;
      font-size: 16px;
      padding: 5px 10px;
      background-color: #3c3c3e;
      border-radius: 5px;
    }
    nav a.active, .sub-nav a.active { background-color: #f09300; color: white; }
    nav a:hover, .sub-nav a:hover { background-color: #f09300; color: white; }

    .questions-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .question-step {
      width: 100%;
      text-align: center;
      margin-bottom: 15px;
    }

    .question-step p {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .question-buttons button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      background-color: #3c3c3e;
      color: #d3d3d3;
      cursor: pointer;
    }

    .question-buttons button.active { background-color: #f09300; color: white; }
    .question-buttons button:disabled { background-color: #666; cursor: not-allowed; }

    .generate-btn {
      margin-top: 15px;
      padding: 8px 16px;
      font-size: 16px;
      background-color: #f09300;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
    }

    .table-container {
      width: 75%; 
      margin: 0 auto;
      overflow-x: auto;
      padding-left: 10px; 
      padding-right: 10px; 
      box-sizing: border-box;
    }

    table {
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 20px; 
      background-color: #3c3c3e; 
      font-size: 16px;
    }
    th, td { padding: 8px; text-align: center; border: none; }
    th { background-color: #f09300; color: white; }
    tr:nth-child(even) { background-color: #2c2c2e; }

    @media (max-width: 600px) {
      .header img { width: 60px; }
      .header h1 { font-size: 24px; }
      nav a, .sub-nav a { display: block; margin: 5px 0; font-size: 16px; }
      body, html { margin: 0; padding: 0; overflow-x: hidden; }
      .table-container { width: 100%; }
      table { font-size: 9px; }
      th, td { padding: 2px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="images/mcpredcirclebg.png" alt="MC Predict Logo">
    <h1>MC PREDICT</h1>
  </div>

  <nav>
    <a href="/index">HOME</a>
    <a href="/lucky-dip" class="active">LUCKY DIP</a>
    <a href="/hda-value">MATCH RESULT</a>
    <a href="/uo-value">UNDER/OVER 2.5</a>
  </nav>

  <div class="sub-nav">
    <a href="/lucky-dip" class="active">PLAY</a>
  </div>

  <div class="questions-container" id="questionsContainer">
    <!-- Steps will be dynamically generated here -->
  </div>

  <button class="generate-btn" id="generateBtn">Generate Selections</button>

  <div class="table-container" id="sheet-data"></div>

  <script>
    let allRows = [];
    let headerRow = [];
    let dataRows = [];
    
    const questionsContainer = document.getElementById("questionsContainer");
    const generateBtn = document.getElementById("generateBtn");

    const userSelections = [];

    // Step questions and options
    const steps = [
      { question: "Step 1: Select Day", column: 0, options: [], multiple: false },
      { question: "Step 2: Select Match Result", column: 5, options: ["HOME WIN", "AWAY WIN"], multiple: false },
      { question: "Step 3: Number of Selections", column: null, options: [1,2,3,4,5,6,7,8], multiple: false }
    ];

    async function loadCSV() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=772292951&single=true&output=csv";
      const response = await fetch(url);
      const text = await response.text();
      allRows = text.trim().split("\n").map(r => r.split(","));
      headerRow = allRows[1] || [];
      dataRows = allRows.slice(2);

      // Populate day options for Step 1
      steps[0].options = Array.from(new Set(dataRows.slice(0,28).map(r => r[0].trim()))).filter(v => v);

      renderStep(0);
      renderTable();
    }

    function renderStep(index) {
      if(index >= steps.length) return;

      // Remove any steps after current
      while(questionsContainer.children.length > index) {
        questionsContainer.removeChild(questionsContainer.lastChild);
      }

      const step = steps[index];
      const stepDiv = document.createElement("div");
      stepDiv.className = "question-step";

      const questionText = document.createElement("p");
      questionText.textContent = step.question;
      stepDiv.appendChild(questionText);

      const buttonsDiv = document.createElement("div");
      buttonsDiv.className = "question-buttons";

      step.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.addEventListener("click", () => {
          userSelections[index] = opt;
          Array.from(buttonsDiv.children).forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          if(index + 1 < steps.length) {
            // Step 3 only shown after Step 2
            if(index + 1 === 2 && !userSelections[1]) return;
            renderStep(index + 1);
          }
          checkGenerateButton();
        });
        // Grey out Step 3 buttons beyond available selections
        if(step.question.includes("Number") && opt > availableSelections()) {
          btn.disabled = true;
        }
        buttonsDiv.appendChild(btn);
      });

      stepDiv.appendChild(buttonsDiv);
      questionsContainer.appendChild(stepDiv);
    }

    function checkGenerateButton() {
      const allAnswered = steps.every((_, i) => userSelections[i]);
      generateBtn.style.display = allAnswered ? "inline-block" : "none";
    }

    function availableSelections() {
      // Limit number of selections by number of matches for chosen day and result
      if(!userSelections[0] || !userSelections[1]) return 0;
      return dataRows.slice(0,28).filter(r => r[0].trim() === userSelections[0] && r[5].trim().toUpperCase() === userSelections[1]).length;
    }

    generateBtn.addEventListener("click", () => {
      renderTable();
      window.scrollTo({top: questionsContainer.offsetTop, behavior: "smooth"});
    });

    function rowMatchesSelections(row) {
      if(!userSelections[0] || !userSelections[1]) return false;
      return row[0].trim() === userSelections[0] && row[5].trim().toUpperCase() === userSelections[1];
    }

    function renderTable() {
      const container = document.getElementById("sheet-data");
      let html = "<table>";
      if(headerRow.length) html += "<tr>" + headerRow.map(c => `<th>${c}</th>`).join("") + "</tr>";
      let filteredRows = dataRows.filter(rowMatchesSelections);
      const num = userSelections[2] ? Math.min(userSelections[2], filteredRows.length) : filteredRows.length;
      filteredRows.slice(0,num).forEach(row => {
        html += "<tr>" + row.map(c => `<td>${c}</td>`).join("") + "</tr>";
      });
      html += "</table>";
      container.innerHTML = html;
    }

    loadCSV();
  </script>
</body>
</html>
