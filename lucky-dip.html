<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC PREDICT - Lucky Dip</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;700&display=swap');
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Proxima Nova', Arial, sans-serif;
      background-color: #2c2c2e;
      color: #d3d3d3;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      text-align: center;
      flex-wrap: wrap;
    }
    .header img {
      width: 80px;
      margin-right: 10px;
    }
    .header h1 {
      font-size: 36px;
      margin: 0;
      text-transform: uppercase;
    }
    nav {
      margin-bottom: 10px;
      text-align: center;
    }
    nav a {
      color: #d3d3d3;
      text-decoration: none;
      margin: 0 10px;
      font-size: 16px;
      padding: 5px 10px;
      background-color: #3c3c3e;
      border-radius: 5px;
    }
    nav a.active {
      background-color: #f09300;
      color: white;
    }
    nav a:hover {
      background-color: #f09300;
      color: white;
    }

    .loading-message {
      font-size: 16px;
      color: #f0f0f0;
      text-align: center;
      margin-bottom: 20px;
    }

    .question {
      display: none;
      margin: 20px 0;
      text-align: center;
    }
    .question.active {
      display: block;
    }
    .question h3 {
      margin-bottom: 10px;
      font-size: 20px;
      color: #fff;
    }
    .question button {
      margin: 5px;
      padding: 8px 14px;
      font-size: 16px;
      background-color: #3c3c3e;
      border: none;
      border-radius: 6px;
      color: #d3d3d3;
      cursor: pointer;
    }
    .question button.active {
      background-color: #f09300;
      color: #fff;
    }
    .question button:hover {
      background-color: #f09300;
      color: #fff;
    }

    .generate-btn {
      display: none;
      margin: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background-color: #f09300;
      color: #fff;
      cursor: pointer;
    }

    /* Table container - full width on mobile */
    .table-container {
      width: 100%;
      margin-top: 20px;
      padding: 0;
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
      background-color: #3c3c3e;
      font-size: 16px;
    }
    th, td {
      padding: 8px;
      text-align: center;
      border: none;
    }
    th {
      background-color: #f09300;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #2c2c2e;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .header img { width: 60px; }
      .header h1 { font-size: 24px; }
      nav a {
        display: block;
        margin: 5px 0;
        font-size: 16px;
      }
      table {
        font-size: 9px;
      }
      th, td {
        padding: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="images/mcpredcirclebg.png" alt="MC Predict Logo">
    <h1>MC PREDICT</h1>
  </div>
  <nav>
    <a href="/index">HOME</a>
    <a href="/lucky-dip" class="active">LUCKY DIP</a>
  </nav>

  <div class="loading-message" id="loadingMessage">Loading questions...</div>

  <div class="question" id="q1">
    <h3>Match Winner or Under/Over 2.5 Goals?</h3>
    <button onclick="selectAnswer('market','Match Winner')">Match Winner</button>
    <button onclick="selectAnswer('market','Under/Over 2.5 Goals')">Under/Over 2.5 Goals</button>
  </div>

  <div class="question" id="q2"></div>
  <div class="question" id="q3"></div>
  <div class="question" id="q4"></div>
  <div class="question" id="q5"></div>

  <button class="generate-btn" id="generateBtn" onclick="generateResults()">Generate</button>

  <div class="table-container" id="results"></div>

  <script>
    let answers = {};
    let sheetUrls = {
      "Match Winner|Value": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=772292951&single=true&output=csv",
      "Match Winner|Chance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=1040433174&single=true&output=csv",
      "UO|Value": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=702828084&single=true&output=csv",
      "UO|Chance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=1035748278&single=true&output=csv"
    };

    window.onload = () => {
      document.getElementById("loadingMessage").style.display = "none";
      document.getElementById("q1").classList.add("active");
    };

    function selectAnswer(step, value) {
      answers[step] = value;
      if(step==="market"){
        let q2 = document.getElementById("q2");
        q2.innerHTML = "<h3>Choose outcome type:</h3>";
        if(value==="Match Winner"){
          q2.innerHTML += `<button onclick="selectAnswer('result','HOME WIN')">Home Wins</button>
                           <button onclick="selectAnswer('result','AWAY WIN')">Away Wins</button>
                           <button onclick="selectAnswer('result','BOTH')">Home & Away Wins</button>`;
        } else {
          q2.innerHTML += `<button onclick="selectAnswer('result','UNDER 2.5 GOALS')">Under 2.5 Goals</button>
                           <button onclick="selectAnswer('result','OVER 2.5 GOALS')">Over 2.5 Goals</button>
                           <button onclick="selectAnswer('result','BOTH')">Under & Over 2.5 Goals</button>`;
        }
        showNext("q2");
      } 
      else if(step==="result"){
        let q3 = document.getElementById("q3");
        q3.innerHTML = `<h3>Good Value or Higher Chance?</h3>
                        <button onclick="selectAnswer('pref','Value')">Good Value</button>
                        <button onclick="selectAnswer('pref','Chance')">Higher Chance</button>`;
        showNext("q3");
      }
      else if(step==="pref"){
        loadDays();
      }
      else if(step==="days"){
        let q5 = document.getElementById("q5");
        q5.innerHTML = `<h3>How many selections? (1–8)</h3>
                        <input type="number" id="numSelect" min="1" max="8" value="3" 
                        style="padding:5px;font-size:16px;text-align:center;width:80px;">`;
        showNext("q5");
        document.getElementById("generateBtn").style.display="block";
      }
    }

    function showNext(id){
      document.querySelectorAll(".question").forEach(q => q.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    async function loadDays(){
      let key = (answers.market==="Match Winner"?"Match Winner":"UO")+"|"+answers.pref;
      const url = sheetUrls[key];
      const response = await fetch(url);
      const text = await response.text();
      const rows = text.trim().split("\n").map(r=>r.split(","));
      if(!rows[19] || rows[19].every(c=>c==="")){
        document.getElementById("results").innerHTML =
          `<p>The model currently has no fixtures to process, please check again later. 
          It is normally ready by 5pm UK time on a Friday but can sometimes be later.</p>`;
        return;
      }
      let days = [...new Set(rows.slice(2).map(r=>r[0]).filter(d=>d))];
      let q4 = document.getElementById("q4");
      q4.innerHTML = `<h3>Select Days</h3>`;
      days.forEach(day=>{
        q4.innerHTML += `<button onclick="toggleDay(this,'${day}')">${day}</button>`;
      });
      showNext("q4");
    }

    function toggleDay(btn,day){
      btn.classList.toggle("active");
      if(!answers.days) answers.days=[];
      if(btn.classList.contains("active")) answers.days.push(day);
      else answers.days = answers.days.filter(d=>d!==day);
      if(answers.days.length>0) selectAnswer("days",answers.days);
    }

    async function generateResults(){
      let key = (answers.market==="Match Winner"?"Match Winner":"UO")+"|"+answers.pref;
      const url = sheetUrls[key];
      const response = await fetch(url);
      const text = await response.text();
      const rows = text.trim().split("\n").map(r=>r.split(","));
      let headers = rows[1];
      let data = rows.slice(2).filter(r=>{
        let resMatch = (answers.result==="BOTH") || (r[5]===answers.result);
        let dayMatch = answers.days.includes(r[0]);
        return resMatch && dayMatch;
      });
      if(data.length===0){
        document.getElementById("results").innerHTML="<p>No results match your criteria.</p>";
        return;
      }
      let n = Math.min(parseInt(document.getElementById("numSelect").value)||1, data.length);
      let weighted = [];
      data.forEach((row,i)=>{
        let weight = (i<28?3:1);
        for(let j=0;j<weight;j++) weighted.push(row);
      });
      let picked=[];
      while(picked.length<n && weighted.length){
        let choice = weighted.splice(Math.floor(Math.random()*weighted.length),1)[0];
        if(!picked.includes(choice)) picked.push(choice);
      }
      let html="<table><tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr>";
      picked.forEach(r=>{
        html+="<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>";
      });
      html+="</table><button class='generate-btn' onclick='generateResults()'>Regenerate</button>";
      document.getElementById("results").innerHTML=html;
    }
  </script>
</body>
</html>
