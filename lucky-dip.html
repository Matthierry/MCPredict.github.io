<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Dip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #2c2c2e;
      color: #bdbdbd;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #f09300;
    }

    .question {
      margin: 20px 0;
    }

    .options {
      margin-top: 10px;
    }

    .options button {
      background-color: #222224;
      color: #bdbdbd;
      border: 1px solid #444;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
    }

    .options button.active {
      background-color: #f09300;
      color: #fff;
    }

    .options button:disabled {
      background-color: #555;
      cursor: not-allowed;
      color: #999;
    }

    #generateBtn, #regenerateBtn {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #generateBtn {
      background-color: #444;
      color: #fff;
    }

    #regenerateBtn {
      background-color: #f09300;
      color: #fff;
      display: none;
    }

    table {
      width: 75%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #222224;
      color: #bdbdbd;
    }

    table th, table td {
      border: 1px solid #444;
      padding: 8px;
      text-align: center;
    }

    table th {
      background-color: #333;
    }

    /* Mobile full width */
    @media (max-width: 768px) {
      table {
        width: 100%;
        font-size: 14px;
      }
      .options button {
        display: block;
        width: 100%;
      }
    }

    /* Loading message */
    .loading-message {
      color: #f09300;
      font-size: 18px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Lucky Dip</h1>

  <div id="questions"></div>
  <div id="loadingArea"></div>
  <button id="generateBtn" style="display:none;">Generate</button>
  <button id="regenerateBtn">Regenerate</button>
  <div id="results"></div>

  <script>
    const questionsDiv = document.getElementById("questions");
    const loadingArea = document.getElementById("loadingArea");
    const generateBtn = document.getElementById("generateBtn");
    const regenerateBtn = document.getElementById("regenerateBtn");
    const resultsDiv = document.getElementById("results");

    let loadingTimer;
    let dotsInterval;

    // Show loading message with animated dots
    function showLoadingMessage() {
      let dots = "";
      loadingArea.innerHTML = `<div class="loading-message">Loading your lucky dip${dots}</div>`;
      dotsInterval = setInterval(() => {
        dots = dots.length < 4 ? dots + "." : "";
        loadingArea.innerHTML = `<div class="loading-message">Loading your lucky dip${dots}</div>`;
      }, 500);
    }

    // Hide loading message
    function hideLoadingMessage() {
      clearInterval(dotsInterval);
      loadingArea.innerHTML = "";
    }

    // Simulate fetching the first question
    function loadFirstQuestion() {
      // Show loader if fetching takes longer than 1 second
      loadingTimer = setTimeout(showLoadingMessage, 1000);

      // Simulate async delay (replace this with your actual fetch)
      setTimeout(() => {
        clearTimeout(loadingTimer);
        hideLoadingMessage();
        renderQuestion1();
      }, 1500);
    }

    function renderQuestion1() {
      const q1 = document.createElement("div");
      q1.classList.add("question");
      q1.innerHTML = `<p>Do you want Match Winner or Under/Over 2.5 Goals?</p>
        <div class="options">
          <button>Match Winner</button>
          <button>Under/Over 2.5 Goals</button>
        </div>`;
      questionsDiv.appendChild(q1);
    }

    // Load first question when page loads
    window.onload = loadFirstQuestion;
  </script>
</body>
</html>
