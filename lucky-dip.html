<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC PREDICT - Lucky Dip</title>
  <style>
    :root {
      --bg: #2c2c2e;
      --secondary: #222224;
      --text: #bdbdbd;
      --accent: #f09300;
    }
    body {
      margin: 0;
      font-family: 'Proxima Nova', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }
    .header img { width: 80px; margin-right: 10px; }
    .header h1 { font-size: 36px; margin: 0; text-transform: uppercase; }
    nav, .sub-nav {
      margin: 10px 0;
      text-align: center;
    }
    nav a, .sub-nav a {
      color: var(--text);
      text-decoration: none;
      margin: 0 10px;
      font-size: 16px;
      padding: 5px 10px;
      background-color: var(--secondary);
      border-radius: 5px;
    }
    nav a.active, .sub-nav a.active { background-color: var(--accent); color: white; }
    nav a:hover, .sub-nav a:hover { background-color: var(--accent); color: white; }

    .question { margin: 20px 0; text-align: center; }
    .options { display: flex; justify-content: center; flex-wrap: wrap; }
    .options button {
      margin: 5px; padding: 10px 20px;
      border: none; border-radius: 5px;
      background: var(--secondary); color: var(--text);
      cursor: pointer;
    }
    .options button.active { background: var(--accent); color: white; }
    .options button:disabled { opacity: 0.5; cursor: not-allowed; }
    #generate, #regenerate {
      margin: 20px auto; padding: 10px 20px;
      border: none; border-radius: 5px;
      display: block; cursor: pointer;
    }
    #generate { background: var(--secondary); color: var(--text); }
    #generate:disabled { opacity: 0.5; cursor: not-allowed; }
    #regenerate { background: var(--accent); color: white; display: none; }

    .table-container {
      width: 75%; margin: 20px auto; overflow-x: auto;
    }
    table {
      border-collapse: collapse; width: 100%;
      background: var(--secondary);
    }
    th, td { padding: 8px; text-align: center; border: none; }
    th { background: var(--accent); color: white; }
    tr:nth-child(even) { background: var(--bg); }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .header img { width: 60px; }
      .header h1 { font-size: 24px; }
      nav a, .sub-nav a { display: block; margin: 5px 0; }
      .table-container { width: 100%; }
      table { font-size: 10px; }
      th, td { padding: 4px; }
    }

    /* Fullscreen overlay loader */
    #page-loader {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: var(--bg);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:9999;
      color: var(--accent);
      font-size:20px;
      font-weight:600;
    }
    .dots::after {
      content: '...';
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="page-loader">
    <div>Loading your lucky dip<span class="dots"></span></div>
  </div>

  <div class="header">
    <img src="images/mcpredcirclebg.png" alt="MC Predict Logo">
    <h1>MC PREDICT</h1>
  </div>
  <nav>
    <a href="/index">HOME</a>
    <a href="/hda-value">MATCH RESULT</a>
    <a href="/uo-value">UNDER/OVER 2.5</a>
    <a href="/lucky-dip" class="active">LUCKY DIP</a>
  </nav>

  <div id="no-data" style="display:none; text-align:center; margin:20px; color:var(--accent); font-size:18px;"></div>

  <div id="wizard" style="display:none; flex-direction:column; align-items:center; width:100%;">
    <div id="q1" class="question">
      <div>Match Winner or Under/Over 2.5 Goals?</div>
      <div class="options">
        <button data-market="MW">Match Winner</button>
        <button data-market="UO">Under/Over 2.5</button>
      </div>
    </div>
    <div id="q2" class="question" style="display:none;"></div>
    <div id="q3" class="question" style="display:none;">
      <div>Which do you prefer?</div>
      <div class="options">
        <button data-pref="VALUE">A good value bet</button>
        <button data-pref="HIGH">A higher chance of winning</button>
      </div>
    </div>
    <div id="q4" class="question" style="display:none;">
      <div>Select Day(s):</div>
      <div class="options" id="day-options"></div>
    </div>
    <div id="q5" class="question" style="display:none;">
      <div>How many selections?</div>
      <div class="options" id="count-options"></div>
    </div>
    <button id="generate" disabled>Generate</button>
    <button id="regenerate">Regenerate</button>
  </div>

  <div class="table-container" id="results"></div>

  <script>
    const CHECK_SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=772292951&single=true&output=csv";
    const SHEETS = {
      MW_VALUE: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=772292951&single=true&output=csv",
      MW_HIGH: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=1040433174&single=true&output=csv",
      UO_VALUE: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=702828084&single=true&output=csv",
      UO_HIGH: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_1dSqKC6BUuykrL9QA5_fwiIEodU3jXBCskHCA7uVU-EYnHusQWZhMFwZXNvk2bFlElmsQHZ3b4n2/pub?gid=1035748278&single=true&output=csv"
    };

    let selected = { market:null, sub:null, pref:null, days:new Set(), count:null };
    let currentSheet = null, allRows=[], headerRow=[], dataRows=[];

    function $(id){ return document.getElementById(id); }
    function csvToRows(text){ return text.trim().split("\n").map(r=>r.split(",")); }
    async function fetchText(url){ const r=await fetch(url); return r.text(); }

    async function init(){
      try {
        const txt = await fetchText(CHECK_SHEET);
        const rows = csvToRows(txt);
        const row20 = rows[19];
        if(!row20 || row20.every(cell => (cell||"").trim() === "")){
          $("no-data").style.display = "block";
          $("no-data").textContent = "The model currently has no fixtures to process, please check again later. It is normally ready by 5pm UK time on a Friday but can sometimes be later.";
        } else {
          $("wizard").style.display = "flex";
        }
      } catch(e){
        console.error(e);
        $("no-data").style.display = "block";
        $("no-data").textContent = "Error loading data. Please try again later.";
      } finally {
        // hide loader after check
        document.getElementById("page-loader").style.display = "none";
      }
    }

    init();
  </script>
</body>
</html>
