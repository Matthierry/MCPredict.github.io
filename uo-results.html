<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC PREDICT - MATCH WINNER BEST VALUE </title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="images/mcpredcirclebg.png" alt="MC Predict Logo">
        <h1>MC PREDICT</h1>
    </div>
    <nav>
    <a href="/index">HOME</a>
    <a href="/hda-value">MATCH RESULT</a>
    <a href="/uo-value">UNDER/OVER 2.5</a>
    <a href="/lucky-dip">LUCKY DIP</a>
    <a href="/historical" class="active">HISTORICAL DATA</a>
    </nav>
    </div>
    <div class="mobile-info">If you are viewing on mobile, the table has been resized to fit your screen</div>
    <div class="loading-message" id="loadingMessage">Loading latest data...</div>
    <div class="table-container table-container--narrow" id="sheet-data"></div>

    <script>
        async function loadCSV() {
            const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeausAAqFFCFoB0NK4vjsgmmzxP_J-WtgvUdusuau-jmJ3d3fqPAAa_ujd7nGYag5rJFOysZZUYiA/pub?gid=1843663391&single=true&output=csv";
            const response = await fetch(url);
            const text = await response.text();
            const rows = text.trim().split("\n").map(r => r.split(","));

            let html = "<table>";
            rows.forEach((row, i) => {
                html += "<tr>";
                row.forEach(cell => {
                    html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
                });
                html += "</tr>";
            });
            html += "</table>";

            document.getElementById("sheet-data").innerHTML = html;
            document.getElementById("loadingMessage").style.display = "none";
        }
        loadCSV();
    </script>
</body>
</html>
