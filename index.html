<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Predict</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Proxima Nova', Arial, sans-serif;
            color: #d3d3d3;
            background-color: #2c2c2e;
            margin: 0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #3c3c3e;
            border-bottom: 2px solid #40c456;
        }
        .header img {
            width: 60px;
            margin-right: 15px;
        }
        .header h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background-color: #3c3c3e;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        nav a {
            text-decoration: none;
            color: #d3d3d3;
            background-color: #3c3c3e;
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 45px;
            min-width: 120px;
            max-width: 200px;
            transition: all 0.3s;
        }
        nav a.active, nav a:hover {
            background-color: #40c456;
            color: white;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .loading-message {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            margin-bottom: 15px;
        }
        .spinner {
            border: 4px solid #3c3c3e;
            border-top: 4px solid #40c456;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        iframe {
            width: 100%;
            height: 75vh;
            border: none;
            display: block;
            margin: 0 auto;
        }
        @media (min-width: 1024px) {
            iframe {
                width: 70%; /* Restrict width to fit content */
                height: 85vh;
                transform: scale(1.1); /* Zoom in slightly for desktop */
                transform-origin: top center;
            }
        }
        @media (max-width: 600px) {
            iframe {
                width: 100%; /* Full width on small devices */
                height: 75vh;
                transform: scale(0.8); /* Zoom out for better content view */
                transform-origin: top center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Soccerball.svg/200px-Soccerball.svg.png" alt="Soccer Ball">
        <h1>MC Predict</h1>
    </div>
    <nav>
        <a href="index.html" class="active">Highest Chance Bets</a>
        <a href="best-value-bets.html">Best Value Bets</a>
        <a href="index.html">All Fixtures</a>
        <a href="highest-chance-sat3pm.html">Saturday 3pm</a>
    </nav>
    <div class="content">
        <div class="loading-message" id="loadingMessage">
            <div class="spinner"></div>
        </div>
        <iframe id="dataIframe" src="https://docs.google.com/spreadsheets/d/1zs1JMyb8ek4W7ATXk3Aj-GTWTZbUzXQci2k1h9r6ipw/pubhtml?gid=8873592&single=true"></iframe>
    </div>
    <script>
        const loadingMessage = document.getElementById('loadingMessage');
        const dataIframe = document.getElementById('dataIframe');
        dataIframe.onload = () => {
            loadingMessage.style.display = 'none';
        };
    </script>
</body>
</html>
