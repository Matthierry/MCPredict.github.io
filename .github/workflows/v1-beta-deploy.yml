name: MC Predict V1 Beta Deploy

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpredict-v1-beta
  cancel-in-progress: true

jobs:
  deploy-beta:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/agent/'))
    runs-on: ubuntu-latest
    env:
      PRIMARY_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRIMARY_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALTERNATE_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ALTERNATE_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          token="${PRIMARY_CF_API_TOKEN:-${ALTERNATE_CF_API_TOKEN:-}}"
          account="${PRIMARY_CF_ACCOUNT_ID:-${ALTERNATE_CF_ACCOUNT_ID:-}}"

          if [[ -n "$token" && -n "$account" ]]; then
            echo "::add-mask::$token"
            echo "::add-mask::$account"
            echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are not configured on this repository under the supported names."
            {
              echo "## MC Predict beta deployment"
              echo
              echo "Deployment was safely skipped because a Cloudflare API token and account ID are not configured as GitHub Actions secrets."
              echo
              echo "Supported secret pairs: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, or CF_API_TOKEN + CF_ACCOUNT_ID."
              echo
              echo "No production resources were changed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-audit --no-fund

      - name: Run tests
        if: steps.credentials.outputs.available == 'true'
        run: npm test

      - name: Build application
        if: steps.credentials.outputs.available == 'true'
        run: npm run build

      - name: Create or locate beta D1 database
        if: steps.credentials.outputs.available == 'true'
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/mcpredict-bootstrap.jsonc <<'EOF'
          {
            "name": "mcpredict-bootstrap",
            "compatibility_date": "2026-08-18"
          }
          EOF

          list_databases() {
            npx wrangler d1 list --json --config /tmp/mcpredict-bootstrap.jsonc
          }

          database_id="$(list_databases | jq -r '.[] | select(.name == "mcpredict-beta-db") | (.uuid // .id // .database_id // empty)' | head -n 1)"

          if [[ -z "$database_id" ]]; then
            echo "Creating mcpredict-beta-db..."
            npx wrangler d1 create mcpredict-beta-db --location=weur --config /tmp/mcpredict-bootstrap.jsonc
            database_id="$(list_databases | jq -r '.[] | select(.name == "mcpredict-beta-db") | (.uuid // .id // .database_id // empty)' | head -n 1)"
          else
            echo "Reusing existing mcpredict-beta-db."
          fi

          if [[ -z "$database_id" ]]; then
            echo "Unable to resolve the beta D1 database ID." >&2
            exit 1
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

          DB_ID="$database_id" python - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.jsonc")
          text = path.read_text()
          db_id = os.environ["DB_ID"]
          placeholder = "REPLACE_WITH_BETA_D1_DATABASE_ID"
          resolved = f'"database_id": "{db_id}"'

          if placeholder in text:
              path.write_text(text.replace(placeholder, db_id))
          elif resolved in text:
              print("wrangler.jsonc already contains the resolved beta D1 database ID.")
          else:
              raise SystemExit("wrangler.jsonc is bound to a different D1 database ID")
          PY

      - name: Apply D1 migrations
        if: steps.credentials.outputs.available == 'true'
        run: npm run db:migrate:beta

      - name: Deploy beta Worker and static assets
        if: steps.credentials.outputs.available == 'true'
        run: npm run deploy:beta

      - name: Configure protected manual-sync token
        if: steps.credentials.outputs.available == 'true'
        id: sync-token
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put SYNC_TOKEN
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger genuine prediction ingestion
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          SYNC_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --retry 36 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://beta.mcpredict.com/api/internal/sync

      - name: Smoke-test beta API
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --retry 36 --retry-delay 5 --retry-all-errors https://beta.mcpredict.com/api/v1/health)"
          home="$(curl --fail-with-body --retry 36 --retry-delay 5 --retry-all-errors https://beta.mcpredict.com/api/v1/home)"

          echo "$health" | jq -e '.status == "ok" and .database == "ok" and .activeDataset == true' > /dev/null
          echo "$home" | jq -e 'has("fixturesProcessed") and has("topMatchResult") and has("topOverUnder25") and has("hasPredictions")' > /dev/null

      - name: Reconcile deployed beta with published sources
        if: steps.credentials.outputs.available == 'true'
        env:
          RUN_BETA_LIVE_QA: "1"
        run: npx vitest run tests/beta-live.integration.test.ts

      - name: Deployed responsive and interaction QA
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright test --config=playwright.live.config.ts

      - name: Lighthouse beta quality gates
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium)"
          if [[ -z "$chrome_path" ]]; then
            echo "No hosted Chrome/Chromium executable found for Lighthouse." >&2
            exit 1
          fi
          export CHROME_PATH="$chrome_path"

          npx lighthouse https://beta.mcpredict.com/ \
            --quiet \
            --output=json \
            --output-path=/tmp/lighthouse-beta.json \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-beta.json', 'utf8'));
          const scores = {
            performance: report.categories.performance.score,
            accessibility: report.categories.accessibility.score,
            bestPractices: report.categories['best-practices'].score
          };
          const rounded = Object.fromEntries(Object.entries(scores).map(([key, value]) => [key, Math.round(value * 100)]));
          console.log('BETA_LIGHTHOUSE', rounded);

          const performanceIds = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift'
          ];
          for (const id of performanceIds) {
            const audit = report.audits[id];
            if (audit) console.log('PERF_AUDIT', id, audit.displayValue || audit.numericValue || audit.score);
          }

          for (const ref of report.categories.accessibility.auditRefs || []) {
            const audit = report.audits[ref.id];
            if (!audit || audit.score === null || audit.score >= 1) continue;
            console.log('A11Y_FAIL', {
              id: ref.id,
              score: audit.score,
              weight: ref.weight,
              title: audit.title
            });
            const items = audit.details?.items || [];
            for (const item of items.slice(0, 20)) {
              const node = item.node || item;
              console.log('A11Y_NODE', {
                selector: node.selector || null,
                snippet: node.snippet || null,
                failureSummary: node.failureSummary || null
              });
            }
          }

          const failures = [];
          if (scores.performance < 0.90) failures.push(`Performance ${rounded.performance} < 90`);
          if (scores.accessibility < 0.95) failures.push(`Accessibility ${rounded.accessibility} < 95`);
          if (scores.bestPractices < 0.95) failures.push(`Best Practices ${rounded.bestPractices} < 95`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Beta verification summary
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          {
            echo "## MC Predict beta deployment"
            echo
            echo "Deployment, real-data ingestion and beta QA completed successfully."
            echo
            echo "- Worker: mcpredict-beta"
            echo "- D1: mcpredict-beta-db"
            echo "- D1 ID: ${{ steps.d1.outputs.database_id }}"
            echo "- Domain: https://beta.mcpredict.com"
            echo "- Health API: passed"
            echo "- Home API: passed"
            echo "- Source-to-beta Market ID reconciliation: passed"
            echo "- Responsive deployed UI QA: passed"
            echo "- Lighthouse gates: passed"
            echo
            echo "Production/root/www were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
