name: MC Predict V1 CI

on:
  pull_request:
  push:
    branches:
      - agent/mcpredict-v1-rebuild

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("wrangler.jsonc").read_text()
          source = source.replace(
              "REPLACE_WITH_BETA_D1_DATABASE_ID",
              "00000000-0000-0000-0000-000000000000"
          )
          Path("/tmp/wrangler-ci.jsonc").write_text(source)
          PY
          npx wrangler deploy --dry-run --outdir /tmp/mcpredict-worker-dryrun --config /tmp/wrangler-ci.jsonc
