name: MC Predict V1 Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mcpredict-v1-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PRIMARY_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRIMARY_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALTERNATE_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ALTERNATE_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PRODUCTION_ORIGIN: https://www.mcpredict.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish production deploy pending status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg state "pending" \
            --arg context "mcpredict-production/deploy" \
            --arg description "Production deployment and verification in progress" \
            --arg target_url "$run_url" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          token="${PRIMARY_CF_API_TOKEN:-${ALTERNATE_CF_API_TOKEN:-}}"
          account="${PRIMARY_CF_ACCOUNT_ID:-${ALTERNATE_CF_ACCOUNT_ID:-}}"

          if [[ -z "$token" || -z "$account" ]]; then
            echo "Cloudflare production deployment credentials are not configured." >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run release tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Create or locate production D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/mcpredict-bootstrap.jsonc <<'EOF'
          {
            "name": "mcpredict-bootstrap",
            "compatibility_date": "2026-08-18"
          }
          EOF

          list_databases() {
            npx wrangler d1 list --json --config /tmp/mcpredict-bootstrap.jsonc
          }

          database_id="$(list_databases | jq -r '.[] | select(.name == "mcpredict-production-db") | (.uuid // .id // .database_id // empty)' | head -n 1)"

          if [[ -z "$database_id" ]]; then
            echo "Creating mcpredict-production-db..."
            npx wrangler d1 create mcpredict-production-db --location=weur --config /tmp/mcpredict-bootstrap.jsonc
            database_id="$(list_databases | jq -r '.[] | select(.name == "mcpredict-production-db") | (.uuid // .id // .database_id // empty)' | head -n 1)"
          else
            echo "Reusing existing mcpredict-production-db."
          fi

          if [[ -z "$database_id" ]]; then
            echo "Unable to resolve the production D1 database ID." >&2
            exit 1
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

          DB_ID="$database_id" python - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.production.jsonc")
          text = path.read_text()
          db_id = os.environ["DB_ID"]
          placeholder = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
          if placeholder not in text:
              raise SystemExit("Production Wrangler config is missing its D1 placeholder")
          path.write_text(text.replace(placeholder, db_id))
          PY

      - name: Apply production D1 migrations
        shell: bash
        run: npx wrangler d1 migrations apply mcpredict-production-db --remote --config wrangler.production.jsonc

      - name: Deploy production Worker and static assets
        shell: bash
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Configure protected production sync token
        id: sync-token
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put SYNC_TOKEN --config wrangler.production.jsonc
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger genuine production ingestion
        shell: bash
        env:
          SYNC_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --retry 72 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            "$PRODUCTION_ORIGIN/api/internal/sync"

      - name: Smoke-test production API
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --retry 36 --retry-delay 5 --retry-all-errors "$PRODUCTION_ORIGIN/api/v1/health")"
          home="$(curl --fail-with-body --retry 36 --retry-delay 5 --retry-all-errors "$PRODUCTION_ORIGIN/api/v1/home")"

          echo "$health" | jq -e '.status == "ok" and .database == "ok" and .activeDataset == true' > /dev/null
          echo "$home" | jq -e 'has("fixturesProcessed") and has("topMatchResult") and has("topOverUnder25") and has("hasPredictions")' > /dev/null

      - name: Reconcile production with published sources
        shell: bash
        env:
          RUN_BETA_LIVE_QA: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/beta-live.integration.test.ts")
          text = path.read_text()
          text = text.replace('const BETA_ORIGIN = "https://beta.mcpredict.com";', 'const BETA_ORIGIN = "https://www.mcpredict.com";')
          path.write_text(text)
          PY
          npx vitest run tests/beta-live.integration.test.ts

      - name: Deployed production responsive and interaction QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("playwright.live.config.ts")
          text = path.read_text().replace('baseURL: "https://beta.mcpredict.com"', 'baseURL: "https://www.mcpredict.com"')
          path.write_text(text)
          PY
          npx playwright test --config=playwright.live.config.ts

      - name: Lighthouse production quality gates
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium)"
          if [[ -z "$chrome_path" ]]; then
            echo "No hosted Chrome/Chromium executable found for Lighthouse." >&2
            exit 1
          fi
          export CHROME_PATH="$chrome_path"

          npx lighthouse "$PRODUCTION_ORIGIN/" \
            --quiet \
            --output=json \
            --output-path=/tmp/lighthouse-production.json \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-production.json', 'utf8'));
          const scores = {
            performance: report.categories.performance.score,
            accessibility: report.categories.accessibility.score,
            bestPractices: report.categories['best-practices'].score
          };
          const rounded = Object.fromEntries(Object.entries(scores).map(([key, value]) => [key, Math.round(value * 100)]));
          console.log('PRODUCTION_LIGHTHOUSE', rounded);

          const failures = [];
          if (scores.performance < 0.90) failures.push(`Performance ${rounded.performance} < 90`);
          if (scores.accessibility < 0.95) failures.push(`Accessibility ${rounded.accessibility} < 95`);
          if (scores.bestPractices < 0.95) failures.push(`Best Practices ${rounded.bestPractices} < 95`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Verify apex domain remains reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 12 --retry-delay 5 --retry-all-errors https://mcpredict.com/ -o /tmp/apex.html
          test -s /tmp/apex.html

      - name: Production verification summary
        shell: bash
        run: |
          {
            echo "## MC Predict V1 production release"
            echo
            echo "Production deployment, genuine ingestion and post-cutover QA completed successfully."
            echo
            echo "- Worker: mcpredict-production"
            echo "- D1: mcpredict-production-db"
            echo "- D1 ID: ${{ steps.d1.outputs.database_id }}"
            echo "- Production domain: https://www.mcpredict.com"
            echo "- Beta domain retained: https://beta.mcpredict.com"
            echo "- Health API: passed"
            echo "- Home API: passed"
            echo "- Source-to-production reconciliation: passed"
            echo "- Responsive deployed UI QA: passed"
            echo "- Lighthouse gates: passed"
            echo "- Apex domain reachability: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production deploy final status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Production deployment and verification passed"
          else
            state="failure"
            description="Production deployment or verification failed"
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg state "$state" \
            --arg context "mcpredict-production/deploy" \
            --arg description "$description" \
            --arg target_url "$run_url" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
